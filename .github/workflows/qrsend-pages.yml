name: Deploy QR-overføring to GitHub Pages

on:
  push:
    paths: ['qrsend/**', 'qrsend2/**', 'qrsend3/**', 'qrsend4/**', 'qrsend5/**', '.github/workflows/qrsend-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: qrsend-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site (v1 at /, v2 at /v2/, v3 at /v3/, v4 at /v4/, v5 at /v5/)
        run: |
          mkdir _site
          cp -r qrsend/. _site/
          cp -r qrsend2 _site/v2
          cp -r qrsend3 _site/v3
          cp -r qrsend4 _site/v4
          cp -r qrsend5 _site/v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
