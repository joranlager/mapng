name: Deploy QR-overføring to GitHub Pages

on:
  push:
    paths: ['qrsend/**', 'qrsend2/**', '.github/workflows/qrsend-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: qrsend-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site (v1 at /, v2 at /v2/)
        run: |
          mkdir _site
          cp -r qrsend/. _site/
          cp -r qrsend2 _site/v2
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
